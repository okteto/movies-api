apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "movies.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/mongodb-url: {{ .Values.mongodb.url | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 0
      initContainers:
      - name: load-data
        image: {{ .Values.image }}
        command:
          - node
          - load.js
        env:
          - name: MONGODB_URL
            valueFrom:
              secretKeyRef:
                name: api
                key: mongodb-url
      containers:
        - name: api
          image: {{ .Values.image }}
          env:
            - name: MONGODB_URL
              valueFrom:
                secretKeyRef:
                  name: api
                  key: mongodb-url
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            periodSeconds: 1
            httpGet:
              path: /api/healthz
              port: 8080
          readinessProbe:
            periodSeconds: 1
            httpGet:
              path: /api/healthz
              port: 8080
